name: Build Android APK

on:
  push:
    paths-ignore:
      - '.appmint/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Montar el proyecto Android desde appmint.json
        run: |
          curl -fsSL "https://user.uploads.dev/file/47d53218a525747b92a4212694afd665.zip" -o tpl.zip
          unzip -q tpl.zip -d _tpl
          python3 _tpl/build.py .
          rm -rf tpl.zip _tpl

      - name: Dar permisos de ejecucion a gradlew (si existe)
        run: chmod +x gradlew 2>/dev/null || true

      - name: Build APK and AAB
        run: |
          mkdir -p .appmint
          set +e
          # Si no tienes firmas configuradas en build.gradle, usa assembleDebug
          gradle --no-daemon --stacktrace assembleDebug bundleRelease 2>&1 | tee .appmint/build-log.txt
          exit ${PIPESTATUS[0]}

      - name: Guardar log del fallo en el repositorio
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .appmint/build-log.txt 2>/dev/null || true
          git commit -m "appmint: log del fallo" --allow-empty || true
          git push || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: APK-Instalable
          path: app/build/outputs/apk/**/*.apk

      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: APK AppMint v1.0.${{ github.run_number }}
          body: |
            APK generado automáticamente con AppMint Studio.
          files: app/build/outputs/apk/**/*.apk
          fail_on_unmatched_files: false
